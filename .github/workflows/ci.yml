name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: qa-register validate --input data/sample_quality_records.json
      - run: qa-register generate --input data/sample_quality_records.json --output build/powerbi
      - run: test -s build/powerbi/quality_summary.json
      - run: test -s build/powerbi/jira_action_handoff.csv
      - run: test -s build/powerbi/confluence_quality_summary.md

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t quality-assurance-evidence-register .
      - run: docker run --rm quality-assurance-evidence-register
